# Local development dependencies. The app itself runs with `pnpm dev` / `pnpm dev:worker`.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: thrift
      POSTGRES_PASSWORD: thrift
      POSTGRES_DB: thrift_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
volumes:
  pgdata:
